<section class="pagina">
  <div class="encabezado">
    <h2>Reportes (PDF)</h2>
  </div>

  <div *ngIf="mensaje" class="aviso" [class.error]="esError" [class.ok]="!esError" role="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    <span>{{ mensaje }}</span>
  </div>

  <div class="tarjetas">

    <!-- Inventario -->
    <div class="tarjeta" *ngIf="puedeInventario">
      <div class="tarjeta-cab">
        <span class="icono-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        </span>
        <strong>Inventario de piezas</strong>
      </div>
      <p class="nota">Stock actual, valor del inventario y piezas con stock bajo.</p>
      <div class="fila">
        <button class="btn-azul" (click)="generar('inventario', '/reportes/inventario', 'inventario', false)" [disabled]="ocupado !== null">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          {{ ocupado === 'inventario' ? 'Generando...' : 'Descargar PDF' }}
        </button>
        <button class="btn-secundario" (click)="generar('inventario', '/reportes/inventario', 'inventario', true)" [disabled]="ocupado !== null">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          Ver
        </button>
      </div>
    </div>

    <!-- Proyectos y órdenes -->
    <div class="tarjeta" *ngIf="puedeProyectos">
      <div class="tarjeta-cab">
        <span class="icono-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </span>
        <strong>Proyectos y órdenes</strong>
      </div>
      <p class="nota">Todos los proyectos con su estado, orden de trabajo y total.</p>
      <div class="fila">
        <button class="btn-azul" (click)="generar('proyectos', '/reportes/proyectos', 'proyectos', false)" [disabled]="ocupado !== null">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          {{ ocupado === 'proyectos' ? 'Generando...' : 'Descargar PDF' }}
        </button>
        <button class="btn-secundario" (click)="generar('proyectos', '/reportes/proyectos', 'proyectos', true)" [disabled]="ocupado !== null">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          Ver
        </button>
      </div>
    </div>

    <!-- Historial técnico -->
    <div class="tarjeta">
      <div class="tarjeta-cab">
        <span class="icono-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
        </span>
        <strong>Historial técnico del vehículo</strong>
      </div>
      <p class="nota">Trazabilidad completa de las modificaciones de un vehículo.</p>
      <label>
        Vehículo
        <select [(ngModel)]="vehiculoId" class="input-amplio">
          <option [ngValue]="null" disabled>Selecciona un vehículo...</option>
          <option *ngFor="let v of vehiculos" [ngValue]="v.id">
            {{ v.marca }} {{ v.modelo }} ({{ v.placa }})
          </option>
        </select>
      </label>
      <div class="fila">
        <button class="btn-azul" (click)="generarHistorial(false)" [disabled]="ocupado !== null || vehiculoId == null">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          {{ ocupado === 'historial' ? 'Generando...' : 'Descargar PDF' }}
        </button>
        <button class="btn-secundario" (click)="generarHistorial(true)" [disabled]="ocupado !== null || vehiculoId == null">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          Ver
        </button>
      </div>
    </div>

  </div>
</section>
